<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PricePulse Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="logo-text">PricePulse</h1>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="overview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="3" width="7" height="7" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" stroke-width="2"/>
          </svg>
          <span>Overview</span>
        </a>

        <a href="#" class="nav-item" data-view="tracking">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 11l3 3L22 4" stroke-width="2" stroke-linecap="round"/>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-width="2"/>
          </svg>
          <span>Tracking</span>
          <span class="badge" id="trackingBadge">0</span>
        </a>

        <a href="#" class="nav-item" data-view="wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-width="2"/>
          </svg>
          <span>Wishlist</span>
        </a>

        <a href="#" class="nav-item" data-view="deals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-width="2"/>
          </svg>
          <span>Deals</span>
        </a>

        <a href="#" class="nav-item" data-view="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M18 20V10M12 20V4M6 20v-6" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Analytics</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="nav-item" id="settingsNav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="3" stroke-width="2"/>
            <path d="M12 1v6m0 6v6M23 12h-6m-6 0H1" stroke-width="2"/>
          </svg>
          <span>Settings</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="main-header">
        <div class="header-left">
          <h2 class="page-title" id="pageTitle">Overview</h2>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary" id="refreshBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M23 4v6h-6M1 20v-6h6" stroke-width="2" stroke-linecap="round"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Refresh
          </button>
          <button class="btn btn-primary" id="addProductBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 5v14m7-7H5" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add Product
          </button>
        </div>
      </header>

      <!-- Views Container -->
      <div class="views-container">
        <!-- Overview View -->
        <div class="view active" id="overviewView">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-icon" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M9 11l3 3L22 4" stroke-width="2" stroke-linecap="round"/>
                  <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" stroke-width="2"/>
                </svg>
              </div>
              <div class="stat-content">
                <p class="stat-label">Tracked Products</p>
                <h3 class="stat-value" id="statTracked">0</h3>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="stat-content">
                <p class="stat-label">Price Drops</p>
                <h3 class="stat-value" id="statDrops">0</h3>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="stat-content">
                <p class="stat-label">Total Savings</p>
                <h3 class="stat-value" id="statSavings">$0</h3>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-icon" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-width="2"/>
                </svg>
              </div>
              <div class="stat-content">
                <p class="stat-label">Wishlist Items</p>
                <h3 class="stat-value" id="statWishlist">0</h3>
              </div>
            </div>
          </div>

          <div class="content-grid">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Recent Price Drops</h3>
              </div>
              <div class="card-content" id="recentDrops">
                <div class="empty-state-small">No recent price drops</div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Top Deals</h3>
              </div>
              <div class="card-content" id="topDeals">
                <div class="empty-state-small">No deals available</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tracking View -->
        <div class="view" id="trackingView">
          <div class="view-header">
            <div class="search-bar">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <circle cx="11" cy="11" r="8" stroke-width="2"/>
                <path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <input type="text" id="trackingSearch" placeholder="Search tracked products...">
            </div>
            <select id="trackingSort" class="sort-select">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
          <div class="products-grid" id="trackingGrid"></div>
        </div>

        <!-- Other views will be similar -->
        <div class="view" id="wishlistView">
          <div class="products-grid" id="wishlistGrid"></div>
        </div>

        <div class="view" id="dealsView">
          <div class="products-grid" id="dealsGrid"></div>
        </div>

        <div class="view" id="analyticsView">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Price Trends</h3>
            </div>
            <div class="card-content">
              <canvas id="trendsChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Product Detail Modal -->
  <div class="modal" id="productModal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>

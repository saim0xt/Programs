<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PricePulse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="logo-text">PricePulse</h1>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="refreshBtn" aria-label="Refresh prices" title="Refresh prices">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2"/>
              <path d="M9 12l2 2 4-4" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="12" r="3" stroke-width="2"/>
              <path d="M12 1v6m0 6v6M23 12h-6m-6 0H1" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Current Page Detection -->
    <div class="current-page" id="currentPage">
      <div class="page-card">
        <div class="page-info">
          <div class="page-icon">🛍️</div>
          <div class="page-details">
            <h3 class="page-title" id="pageTitle">Product Detected</h3>
            <p class="page-price" id="pagePrice">Loading...</p>
          </div>
        </div>
        <button class="btn btn-primary" id="trackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M12 5v14m7-7H5" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Track Price
        </button>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="tracking" aria-label="Tracking">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 3h7v7H3zm11 0h7v7h-7zm0 11h7v7h-7zM3 14h7v7H3z" stroke-width="2"/>
        </svg>
        <span>Tracking</span>
      </button>
      <button class="tab" data-tab="wishlist" aria-label="Wishlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-width="2"/>
        </svg>
        <span>Wishlist</span>
      </button>
      <button class="tab" data-tab="deals" aria-label="Deals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-width="2"/>
        </svg>
        <span>Deals</span>
      </button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Tracking Tab -->
      <div class="tab-pane active" id="trackingPane">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8" stroke-width="2"/>
            <path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search tracked items..." aria-label="Search tracked items">
        </div>

        <div class="products-container" id="productsContainer">
          <div class="empty-state" id="emptyState">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z" stroke-width="2"/>
            </svg>
            <h3>No Tracked Items</h3>
            <p>Start tracking prices by visiting a product page and clicking "Track Price"</p>
          </div>
        </div>
      </div>

      <!-- Wishlist Tab -->
      <div class="tab-pane" id="wishlistPane">
        <div class="products-container" id="wishlistContainer">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-width="2"/>
            </svg>
            <h3>No Wishlist Items</h3>
            <p>Add items to your wishlist by clicking the heart icon</p>
          </div>
        </div>
      </div>

      <!-- Deals Tab -->
      <div class="tab-pane" id="dealsPane">
        <div class="deals-filter">
          <select id="dealsFilter" aria-label="Filter deals">
            <option value="all">All Deals</option>
            <option value="10">10%+ off</option>
            <option value="20">20%+ off</option>
            <option value="30">30%+ off</option>
          </select>
        </div>
        <div class="products-container" id="dealsContainer">
          <div class="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-width="2"/>
            </svg>
            <h3>No Price Drops Yet</h3>
            <p>We'll notify you when prices drop on your tracked items</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button class="btn btn-secondary btn-block" id="dashboardBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/>
          <path d="M3 9h18M9 21V9" stroke-width="2"/>
        </svg>
        Open Dashboard
      </button>
    </footer>
  </div>

  <!-- Product Card Template -->
  <template id="productCardTemplate">
    <div class="product-card" data-product-id="">
      <div class="product-image-wrapper">
        <img class="product-image" src="" alt="">
        <button class="wishlist-btn" aria-label="Add to wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke-width="2"/>
          </svg>
        </button>
      </div>
      <div class="product-info">
        <h4 class="product-title"></h4>
        <div class="product-meta">
          <span class="product-site"></span>
          <span class="product-date"></span>
        </div>
        <div class="product-pricing">
          <div class="price-current"></div>
          <div class="price-change"></div>
        </div>
        <div class="product-actions">
          <button class="btn btn-sm btn-secondary view-btn">View</button>
          <button class="btn btn-sm btn-secondary chart-btn">Chart</button>
          <button class="btn btn-sm btn-danger delete-btn">Delete</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
